<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <title>{{heading}}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'Helvetica Neue', Arial, sans-serif;
      background-color: #f9fafb;
    ">
    <div style="max-width: 640px; margin: 0 auto; background-color: #ffffff; padding: 0">
      <div style="background-color: #0f172a; padding: 32px; text-align: center">
        <p style="color: #ffffff; font-size: 22px; font-weight: 700; margin: 0">{{sellerName}}</p>
      </div>

      <div style="padding: 40px 32px 32px 32px; background-color: #ffffff">
        <h1
          style="
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            margin-top: 0;
            margin-bottom: 16px;
          ">
          {{heading}}
        </h1>
        <div style="font-size: 15px; line-height: 1.6; color: #374151; margin: 0 0 24px 0">
          {{body}}
        </div>
        {{action}}
        <p style="font-size: 13px; line-height: 1.6; color: #64748b; margin: 0">{{footnote}}</p>
      </div>

      <div style="border-top: 1px solid #e5e7eb; padding: 24px 32px 32px; text-align: center">
        <p style="font-size: 12px; color: #6b7280; margin: 0">
          Sent by {{sellerName}} through Fabric OS.
        </p>
      </div>
    </div>
  </body>
</html>
