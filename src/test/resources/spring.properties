# Different mock/property configurations create separate contexts against the shared PostgreSQL
# container. Bound their lifetime so evicted contexts close both Hikari pools.
# Spring TestContext reads SpringProperties, not Boot's application-test.yml Environment.
# Four cached contexts plus one starting context need at most (4 + 1) * (10 + 3) = 65
# pooled connections, leaving room for Flyway and direct JDBC connections on PostgreSQL's limit.
spring.test.context.cache.maxSize=4
