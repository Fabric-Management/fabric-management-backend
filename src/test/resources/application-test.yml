spring:
  main:
    allow-bean-definition-overriding: true
    register-shutdown-hook: false
  datasource:
    hikari:
      # Keep capacity for concurrent tests without reserving ten idle connections per context.
      maximum-pool-size: 10
      minimum-idle: 1

# CR-11: Explicit system-datasource config for test profile.
# Testcontainers uses the same superuser for all roles — this prevents
# the CR-4 fail-fast guard from rejecting empty credentials at startup.
application:
  jwt:
    secret: ${JWT_SECRET:test-only-jwt-secret-key-not-for-production-min-256-bits-long}
  system-datasource:
    enabled: true
    username: ${spring.datasource.username:test}
    password: ${spring.datasource.password:test}
  email:
    outbox:
      worker-enabled: false
      reclaim-after-minutes: 15
      reclaim-interval-ms: 300000
      dead-letter-monitor-enabled: false

org:
  jobrunr:
    background-job-server:
      enabled: false
    dashboard:
      enabled: false

logging:
  level:
    # One line per Spring test context cache lookup: "hitCount" is a context reused, "missCount" one
    # started from scratch. Each start costs tens of seconds, so missCount is what to watch.
    org.springframework.test.context.cache: DEBUG

management:
  otlp:
    tracing:
      export:
        enabled: false

retention:
  quote:
    enabled: false

# Safe-edit cleanup runs only where a test calls it (SalesOrderEditRetentionIT).
sales:
  edit:
    cleanup-enabled: false

# OpenApiExportIT requires springdoc enabled to fetch /api-docs.yaml.
# Default profile disables it for security (CVE mitigations for swagger-ui/DOMPurify).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
